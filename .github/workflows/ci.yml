name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the version used for local development. Node 20 is
          # deprecated on GitHub-hosted runners.
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # The whole suite in one step. This previously ran three directory-scoped
      # scripts, which between them skipped tests/opendating entirely — the
      # majority of the protocol coverage. A single `npm test` cannot drift out
      # of sync when a new test directory is added.
      - name: Tests
        run: npm test

      - name: Install protocol package dependencies
        working-directory: packages/protocol
        run: npm ci

      - name: Build and pack protocol package
        working-directory: packages/protocol
        run: |
          npm run build
          npm pack --dry-run

      - name: Generate SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: backend-sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify build output
        run: |
          if [ ! -f worker.js ]; then
            echo "ERROR: worker.js not found after build"
            exit 1
          fi
          echo "Build output size: $(wc -c < worker.js) bytes"

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
      - if: github.event_name != 'pull_request'
        run: echo "Dependency review applies to pull requests."
