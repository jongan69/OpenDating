name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

      - name: Security tests
        run: npm run test:security

      - name: Protocol tests
        run: npm run test:protocol

      - name: Verify build output
        run: |
          if [ ! -f worker.js ]; then
            echo "ERROR: worker.js not found after build"
            exit 1
          fi
          echo "Build output size: $(wc -c < worker.js) bytes"
