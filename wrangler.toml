# Change name if you feel like it
name = "opendating-relay"
compatibility_date = "2025-01-04"
main = "worker.js"

# Durable Objects binding
[[durable_objects.bindings]]
name = "RELAY_WEBSOCKET"
class_name = "RelayWebSocket"

# D1 Database binding
[[d1_databases]]
binding = "RELAY_DATABASE"
database_name = "opendating-relay"
database_id = "1151d852-890b-4e31-8ee2-74ee3564e0c1"

# Cron trigger disabled (free plan limit reached)
# Enable manually for paid plans:
# [triggers]
# crons = ["0 0 * * *"]

# Enable logs
[observability.logs]
enabled = true

# Durable Object migration with SQLite storage backend
[[migrations]]
tag = "v4"
new_sqlite_classes = ["RelayWebSocket"]