# Change name if you feel like it
name = "opendating-relay"
compatibility_date = "2025-01-04"
main = "worker.js"

# Durable Objects binding
[[durable_objects.bindings]]
name = "RELAY_WEBSOCKET"
class_name = "RelayWebSocket"

# D1 Database binding
[[d1_databases]]
binding = "RELAY_DATABASE"
database_name = "opendating-relay"
database_id = "1151d852-890b-4e31-8ee2-74ee3564e0c1"

# R2 bucket backing the Blossom media endpoints (profile photos).
# Create it once with: npx wrangler r2 bucket create opendating-media
# Optional — without the binding the media routes return 503 and the app
# degrades to text-only profiles rather than failing.
[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "opendating-media"

# Workers AI — content moderation (profile bios, report triage, image screening).
# Free tier: 10K neurons/day. Degrades open if absent.
[ai]
binding = "AI"

# Task queue — async background jobs (report processing, match notifications,
# deletion cascades). Free tier: 1M operations/month.
[[queues.producers]]
binding = "TASK_QUEUE"
queue = "opendating-tasks"

# Queue consumer — same worker processes the queue via the queue() export.
[[queues.consumers]]
queue = "opendating-tasks"

# KV — caching layer (NIP-11, rate limit state, hot profiles).
# Free tier: 1GB storage. Degrades to D1-only reads if absent.
[[kv_namespaces]]
binding = "RELAY_CACHE"
id = "24613f96f0fe4e89ad6893a9e23846f4"

# Cron trigger disabled (free plan limit reached).
# DO alarms handle scheduled maintenance instead — see src/cloudflare/housekeeper.ts.
# Enable manually for paid plans:
# [triggers]
# crons = ["0 0 * * *"]

# Enable logs
[observability.logs]
enabled = true

# Durable Object migration with SQLite storage backend
[[migrations]]
tag = "v4"
new_sqlite_classes = ["RelayWebSocket"]